  - type: APIReference
    url: https://developer.bell.ca/resourceinventory
  - type: OpenAPI
    url: openapi/bell-canada-resource-inventory-api-openapi.json
  - type: Specification
    url: https://developer.bell.ca/uploads/BELL_Canada_API_Specification_Resource_Inventory_v1_6_1_855c08df43.pdf
- aid: bell-canada:bell-canada-change-management-api
  name: Bell Canada Change Management API
  description: >-
    Bell's implementation of the TM Forum TMF655 Change Management Open API (Bell version v1.1, TMF655 v4.2), letting a
    partner raise, update, retrieve and list change requests against Bell services with guaranteed message delivery,
    plus hub/listener notifications for change request create, status change, delete, attribute value change,
    approval-required and failure events.
  humanURL: https://developer.bell.ca/changemanagement
