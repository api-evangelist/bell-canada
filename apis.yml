aid: bell-canada
url: https://raw.githubusercontent.com/api-evangelist/bell-canada/refs/heads/main/apis.yml
name: Bell Canada
kind: company
description: >-
  Bell Canada is Canada's largest communications company and the principal operating subsidiary of BCE Inc., providing
  wireless, wireline, internet, television and enterprise network services across Canada, and operating Bell Media as
  the country's largest broadcaster. As a facilities-based mobile network operator and broadband carrier it sits at the
  connectivity layer of the telecom value chain, and its public API posture reflects that: Bell runs a real developer
  portal at developer.bell.ca whose only published API suite is a set of four TM Forum Open API aligned B2B service
  management interfaces — Trouble Ticket (TMF621), Service Order (TMF641), Resource Inventory (TMF639) and Change
  Management (TMF655) — for enterprise and wholesale partners integrating their ITSM systems with Bell. The Swagger 2.0
  definitions and PDF specifications are downloadable without a login, but access to the sandbox and to any live
  endpoint requires a business registration form and manual approval; no base URL, no credential scheme and no
  self-serve key issuance is published, and the documented request examples redact the credential as a literal
  SECURITY_CREDENTIALS placeholder. Bell publishes no first-party CAMARA network APIs and runs no Open Gateway portal
  of its own. Its network APIs reach developers indirectly, through EnStream LP — the identity and fraud-signal joint
  venture Bell Mobility owns with Rogers and TELUS — which announced a partnership with Aduna, the Ericsson-and-carrier
  joint venture, on 27 February 2025 to distribute Canadian Number Verification and SIM Swap signals through Aduna's
  CAMARA-aligned global channel. Bell is therefore an aggregator-mediated carrier: partner-gated on its own surface,
  reachable by developers only through a third party.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
