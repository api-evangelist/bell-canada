apis:
- aid: bell-canada:bell-canada-trouble-ticket-api
  name: Bell Canada Trouble Ticket API
  description: >-
    Bell's implementation of the TM Forum TMF621 Trouble Ticket Open API (Bell version v2.5, TMF621 v4.1.1), letting an
    enterprise or wholesale partner create, patch, retrieve and list trouble tickets against Bell services from their
    own ITSM or fault management system. Includes the TM Forum hub/listener notification pattern for ticket create,
    attribute-value-change, status-change, delete, resolved and information-required events.
  humanURL: https://developer.bell.ca/troubleticket
  tags:
  - Trouble Ticket
  - Service Assurance
  - TM Forum
  - TMF621
  - B2B
  properties:
  - type: Documentation
    url: https://developer.bell.ca/troubleticket
  - type: APIReference
    url: https://developer.bell.ca/troubleticket
  - type: OpenAPI
    url: openapi/bell-canada-trouble-ticket-api-openapi.json
  - type: Specification
    url: https://developer.bell.ca/uploads/BELL_Canada_API_Specification_Trouble_Ticket_v2_5_af537009fa.pdf
- aid: bell-canada:bell-canada-service-order-api
  name: Bell Canada Service Order API
  description: >-
    Bell's implementation of the TM Forum TMF641 Service Ordering Management Open API (Bell version v1.4, TMF641 v4.6),
    used by partners to place, amend, cancel and track service requests with Bell over a B2B integration. Covers
    serviceOrder and cancelServiceOrder resources plus hub/listener notifications for create, state change, milestone,
    jeopardy, information-required and failure events.
  humanURL: https://developer.bell.ca/serviceorder
  tags:
  - Service Ordering
  - Provisioning
  - TM Forum
  - TMF641
  - B2B
  properties:
  - type: Documentation
    url: https://developer.bell.ca/serviceorder
  - type: APIReference
    url: https://developer.bell.ca/serviceorder
  - type: OpenAPI
    url: openapi/bell-canada-service-order-api-openapi.json
  - type: Specification
    url: https://developer.bell.ca/uploads/BELL_Canada_API_Specification_Service_Order_v1_4_1_1bdd4073d5.pdf
- aid: bell-canada:bell-canada-resource-inventory-api
  name: Bell Canada Resource Inventory Management API
  description: >-
    Bell's implementation of the TM Forum TMF639 Resource Inventory Management Open API (Bell version v1.6, TMF639
    v4.1), exposing logical, physical and generic resource records so partners can query and maintain an inventory
    view of the Bell resources supporting their services, with hub/listener notifications for resource and physical
    resource lifecycle events.
  humanURL: https://developer.bell.ca/resourceinventory
  tags:
  - Resource Inventory
  - Inventory Management
  - TM Forum
  - TMF639
  - OSS
  properties:
  - type: Documentation
