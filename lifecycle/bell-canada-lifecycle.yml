docs_vs_spec_divergence:
  note: >-
    The reference pages document two operations that appear in no Swagger document — GET
    /monitor/{monitorId} (the TMF TransactionMonitor read used to poll a long-running operation) and
    GET /hub/{id} (retrieve a registered listener). Conversely the Swagger documents carry the full
    TM Forum surface including DELETE and the listener callback contracts, which the reference pages
    do not enumerate.
  docs_only:
  - GET /monitor/{monitorId}
  - GET /hub/{id}
  spec_only_examples:
  - DELETE /troubleTicket/{id}
  - DELETE /serviceOrder/{id}
  - DELETE /changeRequest/{id}
  - PATCH /logicalResource/executeJSONPatch
