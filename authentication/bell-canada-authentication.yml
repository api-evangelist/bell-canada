not_supported:
  oauth2: true
  openid_connect: true
  ciba: true
  mutual_tls: unknown
  scopes: true
  note: >-
    No /.well-known/openid-configuration or /.well-known/oauth-authorization-server is served on
    any Bell host probed (developer.bell.ca returns the Next.js HTML catch-all with a 200 status;
