components:
  schemas:
    AttachmentRefOrValue:
      description: An attachment by value or by reference. An attachment complements the description of an element, for example through a document, a video, a picture.
      properties:
        ref:
          $ref: '#/components/schemas/AttachmentRef'
          description: A reference to the Attachment.
        value:
          $ref: '#/components/schemas/Attachment'
          description: The Attachment (as a value).
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
    BellChangeRequestFailureEvent:
      description: The notification data structure
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          event:
            $ref: '#/components/schemas/BellChangeRequestFailureEventPayload'
            description: The event payload linked to the involved resource object
    ChangeRequestStatusType:
      type: string
      description: Possible values for the state of the change request
      enum:
      - acknowledged
      - requestForAuthorization
      - waitForApproval
      - approved
      - scheduled
      - postImplementationReview
      - fallbackExecution
      - cancelled
      - rejected
      - inProgress
      - failed
      - completed
    RelatedParty:
      description: Related Entity reference. A related party defines party or party role linked to a specific entity.
      allOf:
      - $ref: '#/components/schemas/Entity'
      - required:
        - id
        - '@referredType'
        properties:
          id:
            type: string
            description: unique identifier
          href:
            type: string
            format: uri
            description: Hyperlink reference
          name:
            type: string
            description: Name of the related entity.
          role:
            type: string
            description: Role played by the related party
          '@referredType':
            type: string
            description: The actual type of the target instance when needed for disambiguation.
    ChangeRequestRelationship:
      allOf:
      - $ref: '#/components/schemas/Entity'
      - required:
        - relationshipType
        properties:
          id:
            type: string
            description: unique identifier
          href:
            type: string
            format: uri
            description: Hyperlink reference
          relationshipType:
            type: string
          changeRequest:
            $ref: '#/components/schemas/ChangeRequestRefOrValue'
          changeRequestRelationshipCharacteristic:
            type: array
            items:
              $ref: '#/components/schemas/Characteristic'
    AttachmentRef:
      description: Attachment reference. An attachment complements the description of an element (for instance a product) through video, pictures
      allOf:
      - $ref: '#/components/schemas/EntityRef'
      - properties:
          description:
            type: string
            description: A narrative text describing the content of the attachment
          url:
            type: string
            format: uri
            description: Link to the attachment media/content
    ChangeRequestRef:
      description: Reference to a Change Request
      allOf:
      - $ref: '#/components/schemas/EntityRef'
    EventSubscription:
      type: object
      description: Sets the communication endpoint address the service instance must use to deliver notification information
      required:
      - id
      - callback
      properties:
        id:
          type: string
          description: Id of the listener
        callback:
          type: string
          description: The callback being registered.
        query:
          type: string
          description: additional data to be passed
    Record:
      description: A record in a worklog.
      allOf:
      - $ref: '#/components/schemas/Entity'
      - properties:
          id:
            type: string
            description: unique identifier
          href:
            type: string
            format: uri
            description: Hyperlink reference
          dateTime:
            type: string
            format: date-time
            description: The date time that a record is generated.
          description:
            type: string
            description: The detail description in a record.
          supportPerson:
            type: string
            description: The person who logged that record.
    Entity:
      discriminator:
        propertyName: '@type'
      description: Base entity schema for use in TMForum Open-APIs
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
    RelatedEntity:
      description: A reference to an entity, where the type of the entity is not known in advance.
      allOf:
      - $ref: '#/components/schemas/Entity'
      - required:
        - id
        - role
        - '@referredType'
        properties:
          id:
            type: string
            description: unique identifier
          href:
            type: string
            format: uri
            description: Hyperlink reference
          name:
            type: string
            description: Name of the related entity.
          role:
            type: string
            description: The role of an entity.
          '@referredType':
            type: string
            description: The actual type of the target instance when needed for disambiguation.
    ImpactEntity:
      description: A reference to an imapcted entity
      allOf:
      - $ref: '#/components/schemas/Entity'
      - required:
        - id
        - role
        - '@referredType'
        properties:
          id:
            type: string
            description: unique identifier
          href:
            type: string
            format: uri
            description: Hyperlink reference
          action:
            type: string
            description: The action on an entity.
          name:
            type: string
            description: Name of the related entity.
          role:
            type: string
            description: The role of an entity.
          '@referredType':
            type: string
            description: The actual type of the target instance when needed for disambiguation.
    ChangeRequestRefOrValue:
      description: A Service to be created defined by value or existing defined by reference. The polymorphic attributes @type, @schemaLocation & @referredType are related to the Service entity and not the RelatedServiceRefOrValue class itself
      properties:
        ref:
          $ref: '#/components/schemas/ChangeRequestRef'
          description: A reference to the ChangeRequest.
        value:
          $ref: '#/components/schemas/ChangeRequest'
          description: The ChangeRequest (as a value).
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
    ChangeRequestApprovalRequiredEvent:
      description: The notification data structure
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          event:
            $ref: '#/components/schemas/ChangeRequestApprovalRequiredEventPayload'
            description: The event payload linked to the involved resource object
    Characteristic:
      discriminator:
        propertyName: '@type'
      type: object
      description: Describes a given characteristic of an object or entity through a name/value pair.
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
        name:
          type: string
          description: Name of the characteristic
        valueType:
          type: string
          description: Data type of the value of the characteristic
        characteristicRelationship:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicRelationship'
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    Attachment:
      description: Complements the description of an element (for instance a product) through video, pictures...
      allOf:
      - $ref: '#/components/schemas/Entity'
      - properties:
          id:
            type: string
            description: Unique identifier for this particular attachment
          href:
            type: string
            format: uri
            description: URI for this Attachment
          attachmentType:
            type: string
            description: Attachment type such as video, picture
          content:
            type: string
            format: base64
            description: The actual contents of the attachment object, if embedded, encoded as base64
          description:
            type: string
            description: A narrative text describing the content of the attachment
          mimeType:
            type: string
            description: Attachment mime type such as extension file for video, picture and document
          name:
            type: string
            description: The name of the attachment
          url:
            type: string
            format: uri
            description: Uniform Resource Locator, is a web page address (a subset of URI)
          size:
            $ref: '#/components/schemas/Quantity'
            description: The size of the attachment.
          validFor:
            $ref: '#/components/schemas/TimePeriod'
            description: The period of time for which the attachment is valid
    BellChangeRequestFailureEventPayload:
      type: object
      description: The event data structure
      properties:
        failure:
          $ref: '#/components/schemas/BellErrorRepresentation'
          description: The error associated to the failure event
        httpCode:
          type: string
          description: http return code at the API level.
    BellErrorRepresentation:
      description: Bell specialized version of the TMF Error. Used to store the native error representation
      allOf:
      - $ref: '#/components/schemas/Error'
      - properties:
          causedBy:
            type: object
            description: Error cause. May be an Error with custom fields or a list of errors (BellErrorList).
            additionalProperties:
              type: object
          timestamp:
            type: string
            format: date-time
            description: Timestamp when the error is caught, as viewed by the issuer of the error, in ISO 8601 format
          jsonPath:
            type: string
            description: Json path expression associated to the field for which the error is reported. Typically used with validation errors.
    Task:
      description: A step or task along in the process of implementation a Change Request.
      allOf:
      - $ref: '#/components/schemas/Entity'
      - properties:
          id:
            type: string
            description: unique identifier
          href:
            type: string
            format: uri
            description: Hyperlink reference
          description:
            type: string
            description: The description of the task.
          name:
            type: string
            description: The name of the task.
          state:
            type: string
            description: The state of the task.
    ChangeRequest:
      description: "Change Request is a type of request which can be used for the management and control of Change Management process \n -within a service provider organisation or \n -between a customer and a service provider or \n -between a service provider and a partner and vice versa."
      allOf:
      - $ref: '#/components/schemas/Entity'
      - required:
        - targetEntity
        properties:
          id:
            type: string
            description: Identifier of a Change Request. It is created on repository side (a Change Management system)
          href:
            type: string
            format: uri
            description: Hyperlink to access a change request
          actualEndTime:
            type: string
            format: date-time
            description: Date and time when the change implementation actually finished
          actualStartTime:
            type: string
            format: date-time
            description: Date and time when the change implementation actually started
          channel:
            type: string
            description: A channel represents the way the Change Request was created
          completionDate:
            type: string
            format: date-time
            description: Date and time when the change request is confirmed to be completed
          description:
            type: string
            description: Description of the change request
          impact:
            type: string
            description: Indicates the impact of this change
          lastUpdateDate:
            type: string
            format: date-time
            description: Date and time when the change request was updated
          plannedEndTime:
            type: string
            format: date-time
            description: Date and time when the change implementation is planned to be finished
          plannedStartTime:
            type: string
            format: date-time
            description: Date and time when the change implementation is planned to be started
          priority:
            type: string
            description: Used by consumers to prioritize a change request in Change Management system
          requestDate:
            type: string
            format: date-time
            description: Date and time when the change request is raised
          requestType:
            type: string
            description: Indicates the type of the change request
          risk:
            type: string
            description: The risk to implement this change request
          riskMitigationPlan:
            type: string
            description: The risk mitigation plan
          riskValue:
            type: string
            description: The additional cost if the risk will happen
          scheduledDate:
            type: string
            format: date-time
            description: Date and time that the schedule is made
          statusChangeDate:
            type: string
            format: date-time
            description: Date and time when the change request status was changed
          statusChangeReason:
            type: string
            description: Reason of the status change
          attachment:
            description: The attachments of the communication message (when it is email type)
            type: array
            items:
              $ref: '#/components/schemas/AttachmentRefOrValue'
          budget:
            $ref: '#/components/schemas/Money'
          changeRelationship:
            type: array
            items:
              $ref: '#/components/schemas/ChangeRequestRelationship'
          changeRequestCharacteristic:
            type: array
            items:
              $ref: '#/components/schemas/Characteristic'
          externalReference:
            type: array
            items:
              $ref: '#/components/schemas/ExternalReference'
          impactEntity:
            type: array
            items:
              $ref: '#/components/schemas/ImpactEntity'
          location:
            $ref: '#/components/schemas/RelatedPlaceRefOrValue'
            description: A list of places (Place [*]). Used to define a place useful for the service (for example a geographical place whre the service is installed)
          note:
            type: array
            items:
              $ref: '#/components/schemas/Note'
          problemTicket:
            type: array
            items:
              $ref: '#/components/schemas/ServiceProblemRef'
          relatedParty:
            description: The parties involved in the change request
            type: array
            items:
              $ref: '#/components/schemas/RelatedParty'
          resolution:
            $ref: '#/components/schemas/Resolution'
          sla:
            type: array
            items:
              $ref: '#/components/schemas/SLARef'
          specification:
            $ref: '#/components/schemas/EntitySpecificationRef'
          status:
            $ref: '#/components/schemas/ChangeRequestStatusType'
          targetEntity:
            type: array
            items:
              $ref: '#/components/schemas/RelatedEntity'
            minItems: 1
          troubleTicket:
            type: array
            items:
              $ref: '#/components/schemas/TroubleTicketRef'
          workLog:
            type: array
            items:
              $ref: '#/components/schemas/WorkLog'
    ChangeRequestDeleteEvent:
      description: The notification data structure
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          event:
            $ref: '#/components/schemas/ChangeRequestDeleteEventPayload'
            description: The event payload linked to the involved resource object
    ChangeRequestCreateEvent:
      description: The notification data structure
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          event:
            $ref: '#/components/schemas/ChangeRequestCreateEventPayload'
            description: The event payload linked to the involved resource object
    Resolution:
      description: The way one or more change request has been implementation through a direct remedy or task
      allOf:
      - $ref: '#/components/schemas/Entity'
      - properties:
          id:
            type: string
            description: unique identifier
          href:
            type: string
            format: uri
            description: Hyperlink reference
          code:
            type: string
            description: The resolutions code, it can be configured as a multiple level hierarchy
          description:
            type: string
            description: The description of the resolution
          name:
            type: string
            description: The name of the resolution
          task:
            type: array
            items:
              $ref: '#/components/schemas/Task'
    ChangeRequestStatusChangeEvent:
      description: The notification data structure
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          event:
            $ref: '#/components/schemas/ChangeRequestStatusChangeEventPayload'
            description: The event payload linked to the involved resource object
    Quantity:
      type: object
      description: An amount in a given unit
      properties:
        amount:
          type: number
          format: float
          description: Numeric value in a given unit
          default: 1.0
        units:
          type: string
          description: Unit
    ChangeRequestApprovalRequiredEventPayload:
      type: object
      description: The event data structure
      properties:
        changeRequest:
          $ref: '#/components/schemas/ChangeRequest'
          description: The involved resource data for the event
    Place:
      description: Place reference. Place defines the places where the products are sold or delivered.
      allOf:
      - $ref: '#/components/schemas/Entity'
      - properties:
          id:
            type: string
            description: Unique identifier of the place
          href:
            type: string
            description: Unique reference of the place
          name:
            type: string
            description: A user-friendly name for the place, such as [Paris Store], [London Store], [Main Home]
    ServiceProblemRef:
      allOf:
      - $ref: '#/components/schemas/EntityRef'
    ChangeRequestAttributeValueChangeEventPayload:
      type: object
      description: The event data structure
      properties:
        changeRequest:
          $ref: '#/components/schemas/ChangeRequest'
          description: The involved resource data for the event
    CharacteristicRelationship:
      discriminator:
        propertyName: '@type'
      type: object
      description: Another Characteristic that is related to the current Characteristic;
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
        relationshipType:
          type: string
          description: The type of relationship
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    ExternalReference:
      description: External reference of the individual or reference in other system
      allOf:
      - $ref: '#/components/schemas/Entity'
      - properties:
          externalReferenceType:
            type: string
            description: Type of the external reference
          name:
            type: string
            description: External reference name
    ChangeRequestAttributeValueChangeEvent:
      description: The notification data structure
      allOf:
      - $ref: '#/components/schemas/Event'
      - properties:
          fieldPath:
            type: string
            description: The path identifying the object field concerned by this notification.
          event:
            $ref: '#/components/schemas/ChangeRequestAttributeValueChangeEventPayload'
            description: The event payload linked to the involved resource object
    ChangeRequestDeleteEventPayload:
      type: object
      description: The event data structure
      properties:
        changeRequest:
          $ref: '#/components/schemas/ChangeRequest'
          description: The involved resource data for the event
    ChangeRequestStatusChangeEventPayload:
      type: object
      description: The event data structure
      properties:
        changeRequest:
          $ref: '#/components/schemas/ChangeRequest'
          description: The involved resource data for the event
    WorkLog:
      description: A record of the work performed on the change request during the investigation and resolution process.
      allOf:
      - $ref: '#/components/schemas/Entity'
      - properties:
          id:
            type: string
            description: unique identifier
          href:
            type: string
            format: uri
            description: Hyperlink reference
          createDateTime:
            type: string
            format: date-time
            description: Date and time of worklog generated.
          description:
            type: string
            description: The description of the worklog.
          lastUpdateDateTime:
            type: string
            description: Date and time when the worklog updated.
          record:
            type: array
            items:
              $ref: '#/components/schemas/Record'
    Note:
      description: Extra information about a given entity
      allOf:
      - $ref: '#/components/schemas/Entity'
      - properties:
          id:
            type: string
            description: Identifier of the note within its containing entity
          author:
            type: string
            description: Author of the note
          date:
            type: string
            format: date-time
            description: Date of the note
          text:
            type: string
            description: Text of the note
    Error:
      description: Used when an API throws an Error, typically with a HTTP error response-code (3xx, 4xx, 5xx)
      allOf:
      - $ref: '#/components/schemas/Entity'
      - required:
        - code
        - reason
        properties:
          code:
            type: string
            description: Application relevant detail, defined in the API or a common list.
          reason:
            type: string
            description: Explanation of the reason for the error which can be shown to a client user.
          message:
            type: string
            description: More details and corrective actions related to the error which can be shown to a client user.
          status:
            type: string
            description: HTTP Error code extension
          referenceError:
            type: string
            format: uri
            description: URI of documentation describing the error.
    EntitySpecificationRef:
