  camara:
    posture: >-
      No first-party CAMARA implementation; Bell's network APIs reach developers only through EnStream
      (the Bell/Rogers/TELUS identity JV) and its Aduna CAMARA-aligned distribution partnership.
    firstPartyCamaraApis: false
    camaraApisWithEvidence:
    - Number Verification
    - SIM Swap
    camaraEvidence: >-
      Aduna and EnStream announced a strategic partnership on 27 February 2025 to bring Canadian
      telecom network APIs — explicitly Number Verification ("a real-time check that verifies the
      mobile phone number associated with the user's device") and SIM Swap Protection ("a way to
      detect and manage SIM swap events for a mobile number") — from Bell, Rogers and TELUS into
      Aduna's standardized, CAMARA-aligned global API layer. EnStream LP is the joint venture of
      Bell Mobility, Rogers Communications and TELUS Communications. The signals originate on Bell's
      network; the API, the documentation and the developer relationship belong to EnStream and Aduna.
    camaraEvidenceSources:
    - https://www.prnewswire.com/news-releases/aduna-and-enstream-partner-to-unlock-canadas-telecom-network-apis-for-global-innovation-302387733.html
    - https://www.ericsson.com/en/press-releases/2025/2/aduna-and-enstream-partner-to-unlock-canadas-telecom-network-apis-for-global-innovation
    - https://btw.media/en/aduna-adds-canadian-telecom-apis-via-enstream-partnership
    - https://enstream.com/
    bellOwnedCamaraEndpoint: false
    bellOwnedCamaraSpec: false
    bellOwnedCamaraSandbox: false
    ciba: >-
      Not observed. CAMARA specifies OIDC and CIBA (Client-Initiated Backchannel Authentication) for
      network-based authorization, but no CIBA, OIDC or OAuth reference appears anywhere on
      developer.bell.ca, and Bell serves no discovery document.
  openGateway:
    member: unconfirmed
    note: >-
      GSMA's operator support pages returned HTTP 403 to anonymous fetches on the review date, so
      no primary confirmation of Bell Canada on the current GSMA Open Gateway supporter list was
      obtained. Bell operates no Open Gateway portal, publishes no Open Gateway API and makes no
      Open Gateway claim on bell.ca or developer.bell.ca. A 2012 GSMA OneAPI Gateway launch with
      Bell Mobility, Rogers and TELUS is a different, much older programme and must not be read as
      Open Gateway participation.
  tmForum:
    aligned: true
    apis:
    - TMF621 Trouble Ticket v4.1.1
    - TMF639 Resource Inventory Management v4.1
    - TMF641 Service Ordering Management v4.6
    - TMF655 Change Management v4.2
    certified: unconfirmed
    note: >-
      Bell's own API pages declare the TM Forum specification and version each API implements, and the
      harvested Swagger documents carry TM Forum titles and descriptions verbatim. TM Forum's
      certifications-awarded registry returned HTTP 403 to anonymous fetches on the review date, so an
      awarded conformance certificate could not be independently verified. Alignment is documented;
      certification is not confirmed.
  threeGpp:
    nef: false
    scef: false
    networkSlicing: false
    mecApi: false
    note: >-
      The portal markets 5G and MEC (multi-access edge computing) with AWS and Google Cloud logos on
      the products page, but publishes no MEC, network-slicing, NEF or SCEF API and no edge discovery
      endpoint.
  authModel:
    scheme: undisclosed
    evidence: >-
      No securityDefinitions or security block appears in any of the four harvested Swagger documents.
      Every documented curl example redacts the credential as a literal header placeholder
      --header 'SECURITY_CREDENTIALS', alongside --header 'x-external-system' described as
      "for use in sandbox mode only, pass any unique value >= 8 chars". Real credentials are issued
      out of band after the registration form is approved.
    apiKey: unknown
    oauth2: false
    mtls: unknown
    ciba: false
    openidConfiguration: not served
  webhooks:
    present: true
    style: TM Forum hub/listener callback registration (not AsyncAPI)
    note: >-
      Every one of the four APIs implements the TM Forum notification pattern — POST /hub to register
      a listener callback URL, DELETE /hub/{id} to remove it, and a /listener/{event} POST contract per
      event type. No AsyncAPI document is published.
    eventCatalog:
      troubleTicket:
      - troubleTicketCreateEvent
      - troubleTicketAttributeValueChangeEvent
      - troubleTicketStatusChangeEvent
      - troubleTicketDeleteEvent
      - troubleTicketResolvedEvent
