  postman:
    officialWorkspace: false
    note: >-
      A public Postman workspace named "Bell Media" exists under the publisher "Postman Atlas", a
      third-party/auto-generated catalog account, not Bell. Its description asserts Notification and
      Device endpoints that do not appear anywhere on developer.bell.ca, so it was NOT treated as
      evidence and nothing from it was recorded.
  graphql:
    present: false
  grpc:
    present: false
  channelToDevelopers: >-
    Two channels, neither self-serve. For enterprise and wholesale B2B integration, Bell's own
    partner-gated TM Forum service management APIs at developer.bell.ca. For network/identity
    capabilities, no Bell channel at all — developers buy Bell's Number Verification and SIM Swap
    signals from EnStream or from Aduna. This is the central sector finding for Bell: the carrier
    owns the network, an aggregator owns the developer.
  transports:
  - protocol: REST
    scheme: https
    documented: true
    note: All four published APIs are HTTPS REST. Base host is redacted as "serverRoot" in every spec.
  - protocol: Webhook
