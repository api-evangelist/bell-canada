compliance_program:
  published: false
  certifications: []
  trust_center: null
  note: >-
    No trust centre, SOC 2, ISO 27001, PCI DSS or comparable certification is published for the API
    platform. probe-security-programs.py found no trust centre and no vulnerability-disclosure
