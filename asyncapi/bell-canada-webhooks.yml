note: >-
  Bell publishes no AsyncAPI document. It does ship a real, fully specified event surface: the TM
  Forum hub/listener publish-subscribe pattern, implemented identically in all four APIs. A client
  registers a callback with POST /hub (EventSubscription: id, callback, query) and Bell POSTs each
  event to that listener endpoint. Every event type has its own listener contract and its own
  request schema in the Swagger document, which is why this catalogue is derived rather than
  guessed. This artifact is the webhook catalogue; it is wired as type Webhooks, not AsyncAPI.
subscription:
  register:
    operation: POST /hub
    operationId: registerListener
    body: EventSubscription
    fields:
    - name: id
      required: true
      description: Id of the listener
    - name: callback
      required: true
      description: The callback being registered.
    - name: query
      required: false
      description: additional data to be passed (event filtering)
    responses: [201, 400, 401, 403, 404, 405, 409, 500]
  unregister:
    operation: DELETE /hub/{id}
    operationId: unregisterListener
    responses: [204, 400, 401, 403, 404, 405, 500]
  retrieve:
    operation: GET /hub/{id}
    documented_on: https://developer.bell.ca/changemanagement
    in_spec: false
  delivery: >-
    Bell POSTs the event payload to the registered callback. The listener contract is specified in
    the same Swagger document as POST /listener/{eventName}, one route per event type.
  filtering: supported via the EventSubscription.query field (TM Forum event filtering)
  transport: HTTPS POST
  security: >-
    Bell publishes no signing scheme, no shared secret, no replay window and no retry policy for
    callback delivery.
