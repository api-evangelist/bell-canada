summary: >-
  Four TM Forum resource domains, each rooted on a single top-level entity that extends the shared
  TM Forum Entity base schema (@type / @baseType / @schemaLocation) and composes the standard TMF
  reference value objects — RelatedParty, Note, Characteristic, AttachmentRefOrValue,
  ExternalReference. The domains are joined by real cross-domain references: a ChangeRequest points
  at Trouble Tickets (TroubleTicketRef) and Service Problems (ServiceProblemRef), a
  CancelServiceOrder belongs to a ServiceOrder, and LogicalResource / PhysicalResource are both
  specialisations of Resource.
